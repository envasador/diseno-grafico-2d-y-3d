site_name: Diseño Gráfico 2D y 3D
site_description: Material didáctico del módulo Diseño Gráfico 2D y 3D del CE Desarrollo de Videojuegos y Realidad Virtual del IES Rafael Alberti.
site_author: Alejandro Carmona Martos
repo_url: https://github.com/envasador/diseno-grafico-2d-y-3d
repo_name: diseno-grafico-2d-y-3d
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
  - Concept:
      - concept/index.md
      - Proceso creativo: concept/proceso-creativo.md
      - Moodboard: concept/moodboard.md
      - Siluetas: concept/siluetas.md
      - Thumbnails y formas: concept/thumbnails.md
      - Color y luz: concept/color.md
      - Estilos artísticos: concept/estilos-artisticos.md
      - Hojas de producción: concept/hojas-de-produccion.md
      - Perspectiva de género: concept/perspectiva-de-genero.md
      - Biblia de arte: concept/biblia-de-arte.md
  - UT1 Ilustración:
      - ut1/index.md
      - Affinity Designer: ut1/01-affinity-designer.md
      - Personajes y escenarios: ut1/02-dibujo-de-personajes-y-escenarios.md
      - Flujo de un personaje: ut1/03-flujo-de-un-personaje.md
  - UT2 Arte 2D:
      - ut2/index.md
      - El arte 2D: ut2/01-arte-2d.md
      - Programas para pixel art: ut2/02-programas-pixel-art.md
      - Tamaño de la imagen: ut2/03-tamano-de-la-imagen.md
      - Tiles y sprite sheets: ut2/04-tiles-y-sprite-sheets.md
      - Principios de animación: ut2/05-principios-de-animacion.md
      - Animación de espera: ut2/06-animacion-de-espera.md
      - Walking cycle: ut2/07-walking-cycle.md
      - Animación de ataque: ut2/08-animacion-de-ataque.md
      - Escenarios 2D: ut2/09-escenarios-2d.md
  - UT3 Arte 3D:
      - ut3/index.md
      - Introducción a Blender: ut3/01-introduccion-3d-blender.md
      - Modelado básico: ut3/02-modelado-basico.md
      - Materiales y texturas: ut3/03-materiales-y-texturas.md
  - UT4 Cámara y luz:
      - ut4/index.md
      - Iluminación: ut4/01-iluminacion.md
  - Anexo UI/UX:
      - anexo-ui-ux/index.md
      - Introducción UI/UX: anexo-ui-ux/01-introduccion-ui-ux.md
      - Leyes de UX: anexo-ui-ux/02-leyes-ux.md
      - El HUD: anexo-ui-ux/03-hud.md
      - Diseño de producto aplicado: anexo-ui-ux/04-diseno-de-producto-aplicado.md
  - Proyectos:
      - proyectos/index.md
      - Proyecto 1 · Arte 2D: proyectos/proyecto-2d.md
      - Proyecto 2 · Arte 3D: proyectos/proyecto-3d.md
      - Proyecto 3 · Cinemática: proyectos/proyecto-cinematica.md
